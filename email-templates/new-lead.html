<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>New lead</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; }
    @media (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 28px !important; padding-right: 28px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#070b18;">

  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
    New Gromaxx HMS lead: {{user_email}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#070b18" style="background-color:#070b18;">
    <tr>
      <td align="center" style="padding:48px 16px;">

        <table role="presentation" class="container" width="480" cellpadding="0" cellspacing="0" border="0" bgcolor="#0c1430"
               style="width:480px; max-width:480px; background-color:#0c1430; border:1px solid #1e2748; border-top:1px solid #6e5229; border-radius:20px;">

          <!-- Label -->
          <tr>
            <td class="px" style="padding:40px 44px 0; font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif; font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#e8cf9c;">
              &#9679;&nbsp;&nbsp;New lead &middot; Gromaxx HMS
            </td>
          </tr>

          <!-- Lead email -->
          <tr>
            <td class="px" style="padding:14px 44px 0; font-family:'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif; font-size:22px; line-height:30px; font-weight:600; color:#f4efe6; word-break:break-all;">
              <a href="mailto:{{user_email}}" style="color:#f4efe6; text-decoration:none;">{{user_email}}</a>
            </td>
          </tr>

          <!-- Lead details -->
          <tr>
            <td class="px" style="padding:24px 44px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="100" style="padding:10px 0; border-top:1px solid #1e2748; font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif; font-size:13px; color:#7c7f8f;">Company</td>
                  <td style="padding:10px 0; border-top:1px solid #1e2748; font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif; font-size:14px; font-weight:600; color:#f4efe6;">{{lead_company}}</td>
                </tr>
                <tr>
                  <td width="100" style="padding:10px 0; border-top:1px solid #1e2748; font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif; font-size:13px; color:#7c7f8f;">Source</td>
                  <td style="padding:10px 0; border-top:1px solid #1e2748; font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif; font-size:14px; color:#f4efe6;">{{lead_source}}</td>
                </tr>
                <tr>
                  <td width="100" style="padding:10px 0; border-top:1px solid #1e2748; border-bottom:1px solid #1e2748; font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif; font-size:13px; color:#7c7f8f;">Received</td>
                  <td style="padding:10px 0; border-top:1px solid #1e2748; border-bottom:1px solid #1e2748; font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif; font-size:14px; color:#f4efe6;">{{signup_time}}</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Reply button -->
          <tr>
            <td class="px" style="padding:28px 44px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#ddbd7f" style="background-color:#ddbd7f; border-radius:999px;">
                    <a href="mailto:{{user_email}}?subject=Gromaxx%20HMS"
                       style="display:inline-block; padding:12px 26px; font-family:'Manrope','Segoe UI',Helvetica,Arial,sans-serif; font-size:14px; font-weight:600; color:#0b1124; text-decoration:none; border-radius:999px;">
                      Reply to lead &rarr;
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
